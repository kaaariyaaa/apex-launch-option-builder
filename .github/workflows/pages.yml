name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kaaariyaaa/Apex-Legends-Sensitivity-Converter
          ref: main
          path: legacy-converter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm ci
      - name: Build the site
        env:
          ASTRO_BASE_PATH: /apex-launch-option-builder/
          ASTRO_OUT_DIR: ./dist/apex-launch-option-builder
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
        run: npm run build
      - name: Publish the sensitivity converter
        run: |
          mkdir -p dist/Apex-Legends-Sensitivity-Converter
          cp legacy-converter/index.html legacy-converter/script.js legacy-converter/style.css dist/Apex-Legends-Sensitivity-Converter/
      - name: Add custom domain
        run: printf 'kariya.dev\n' > dist/CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
